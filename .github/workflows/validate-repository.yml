name: Validate Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Validate skills, evaluations, links, and packages
        run: python3 .github/scripts/validate_repository.py

      - name: Validate forward-evaluation inputs
        run: |
          python3 .github/scripts/run_behavior_evals.py
          python3 .github/scripts/run_executable_evals.py
          python3 .github/scripts/run_eval_matrix.py
          python3 .github/scripts/run_eval_matrix.py --matrix .github/evals/cross-agent-matrix.json

      - name: Lint Agent Skills specification conformance
        run: bash .github/scripts/run_dart_skills_lint.sh

      - name: Run repository tests
        run: |
          python3 -m unittest discover -s tests -v
          npm test

      - name: Verify npm package contents
        run: npm run pack:check

      - name: Smoke-test Agent Skills discovery
        run: npx --yes skills@1.5.23 add . --list

  responsive-fixture:
    name: Responsive Layout Fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Verify broken and corrected widget layouts
        run: python3 .github/scripts/verify_responsive_fixture.py

  app-workflow-fixture:
    name: App Workflow Fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Populate the locked Flutter package cache
        working-directory: .github/evals/executable/fixtures/app-workflow-task-completion
        run: flutter pub get --enforce-lockfile

      - name: Verify feature contracts and seeded failures
        run: python3 .github/scripts/verify_app_workflow_fixture.py

      - name: Verify media resource ownership and seeded failures
        run: python3 .github/scripts/verify_media_fixture.py
