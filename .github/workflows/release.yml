name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to recover or republish through the release gates
        required: false
        type: string

jobs:
  validate:
    name: Release Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Validate repository
        run: |
          python3 .github/scripts/validate_repository.py --release
          python3 .github/scripts/run_behavior_evals.py
          python3 -m unittest discover -s tests -v
          npm test
          npm run pack:check
          bash .github/scripts/run_dart_skills_lint.sh
          npx --yes skills@1.5.23 add . --list

      - name: Check release versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          marketplace_version="$(jq -r '.metadata.version' .claude-plugin/marketplace.json)"
          claude_plugin_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          codex_version="$(jq -r '.version' .codex-plugin/plugin.json)"
          tessl_version="$(jq -r '.version' .tessl-plugin/plugin.json)"
          npm_version="$(jq -r '.version' package.json)"

          if [[ "$marketplace_version" != "$claude_plugin_version" || "$marketplace_version" != "$codex_version" || "$marketplace_version" != "$tessl_version" || "$marketplace_version" != "$npm_version" ]]; then
            echo "Version mismatch: claude=$marketplace_version claude_plugin=$claude_plugin_version codex=$codex_version tessl=$tessl_version npm=$npm_version" >&2
            exit 1
          fi

          if jq -e --arg version "$marketplace_version" \
            'any(.plugins[]; .version != $version)' \
            .claude-plugin/marketplace.json > /dev/null; then
            echo "The Claude marketplace entry does not match version $marketplace_version" >&2
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$marketplace_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version v$marketplace_version" >&2
            exit 1
          fi

  publish-npm:
    name: Publish npm Package
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Publish immutable package version
        run: |
          set -euo pipefail
          package_name="$(jq -r '.name' package.json)"
          package_version="$(jq -r '.version' package.json)"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; verifying the existing release."
          else
            npm publish
          fi

          published_version=""
          for attempt in {1..60}; do
            if published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null)"; then
              break
            fi
            echo "Registry has not exposed ${package_name}@${package_version} yet (attempt ${attempt}/60; retrying for up to 10 minutes)."
            sleep 10
          done
          if [[ "$published_version" != "$package_version" ]]; then
            echo "Registry version mismatch: expected=$package_version actual=$published_version" >&2
            exit 1
          fi

          installed_version=""
          for attempt in {1..12}; do
            smoke_directory="$(mktemp -d)"
            if installed_version="$(npm exec --yes --prefix "$smoke_directory" --package="${package_name}@${package_version}" -- flutter-skills --version 2>/dev/null)"; then
              break
            fi
            installed_version=""
            echo "Registry has not served the tarball for ${package_name}@${package_version} yet (install attempt ${attempt}/12)."
            sleep 10
          done
          if [[ "$installed_version" != "$package_version" ]]; then
            echo "Installed CLI version mismatch: expected=$package_version actual=$installed_version" >&2
            exit 1
          fi

  publish-tessl:
    name: Publish Tessl Plugin
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: [validate, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Publish Tessl plugin
        run: |
          publish_status=1
          for attempt in 1 2 3; do
            set +e
            publish_output="$(tessl plugin publish . 2>&1)"
            publish_status=$?
            set -e
            printf '%s\n' "$publish_output"

            if [[ $publish_status -eq 0 ]]; then
              exit 0
            fi
            if grep -Fq "already exists" <<<"$publish_output"; then
              echo "Tessl version already exists; treating the immutable release as verified."
              exit 0
            fi
            if ! grep -Fiq "timed out" <<<"$publish_output"; then
              exit "$publish_status"
            fi
            echo "Tessl publish timed out (attempt ${attempt}/3); retrying."
            sleep 15
          done
          exit "$publish_status"

  publish-vscode:
    name: Publish VS Code Extension
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: [validate, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Stage and verify the Marketplace version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          python3 .github/scripts/stage_vscode_extension.py "$work_dir/extension"
          cd "$work_dir/extension"
          version="$(jq -er '.version' package.json)"
          extension_id="$(jq -er '.publisher + "." + .name' package.json)"
          test "$RELEASE_TAG" = "v$version"
          test "$extension_id" = "thienqo.flutter-skills"

          marketplace_has_version() {
            jq -e --arg version "$version" 'any(.versions[]; .version == $version)' > /dev/null
          }

          listing="$(npx --yes @vscode/vsce@4.1.0 show "$extension_id" --json)"
          if marketplace_has_version <<< "$listing"; then
            echo "$extension_id@$version is already public on Visual Studio Marketplace."
            exit 0
          fi

          npx --yes @vscode/vsce@4.1.0 publish --oidc --no-dependencies
          for attempt in {1..60}; do
            if npx --yes @vscode/vsce@4.1.0 show "$extension_id" --json | marketplace_has_version; then
              echo "Verified $extension_id@$version on Visual Studio Marketplace."
              exit 0
            fi
            echo "Waiting for Marketplace verification (attempt $attempt/60)."
            sleep 15
          done
          echo "::error::Marketplace has not exposed $extension_id@$version. Check publisher verification before retrying."
          exit 1

  github-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: [validate, publish-npm, publish-tessl, publish-vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Flutter Skills $RELEASE_TAG" \
              --generate-notes
          fi
