- insert:
    - id: flutter-skills-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: flutter-skills
        includeDefaultRoots: false
        bundledSkillDir: !!js >-
          process.getBuiltinModule('node:path').join(
            process.getBuiltinModule('node:path').dirname(
              process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@thiennc/flutter-skills/package.json')
            ),
            'skills'
          )
